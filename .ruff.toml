target-version = "py310"
line-length = 88
src = ["addons"]
# pre-commit passes explicit file paths; force-exclude keeps the excludes below
# honoured for them too.
force-exclude = true
exclude = [
  ".git",
  ".venv",
  "node_modules",
  "**/static/lib",
  "**/static/description",
  # Vendored third-party addon: keep upstream code untouched.
  "addons/odoo_test_xmlrunner",
]

[lint]
select = ["B", "C90", "E", "F", "I", "UP", "W"]
ignore = ["E203", "E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"__manifest__.py" = ["B018"]

[lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "odoo",
  "odoo-addons",
  "first-party",
  "local-folder",
]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16
