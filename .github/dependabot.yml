version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml (3 days = 4320 minutes): the
    # lockfile must never hold a version younger than this gate. Change both together.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      lint-and-format:
        patterns:
          - "oxlint"
          - "oxfmt"
      types:
        patterns:
          - "@types/*"
          - "@odoo/owl"
          - "typescript"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
